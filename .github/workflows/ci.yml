name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .

  maya-api:
    name: Maya API usage (maya-stubs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install maya-stubs
      - run: python tools/check_maya_api.py scripts install

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Maya 2023 = 3.9, Maya 2024 = 3.10, Maya 2025/2026 = 3.11
        python-version: ["3.9", "3.10", "3.11"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      # PySide6 6.12.0 loses a reference to None on every void call on Python <= 3.11:
      # the banner test makes thousands, then Python aborts at exit (code 134)
      - run: pip install pytest maya-stubs "PySide6-Essentials<6.12"
      - run: python -m compileall -q scripts install tools
      - run: python -m pytest
